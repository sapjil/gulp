allowBuilds:
  '@parcel/watcher': true
  es5-ext: false

overrides:
  lodash: ^4.18.0
  minimatch@<3.1.4: ^3.1.4
  node-uuid: ^1.4.8
  postcss@<8.5.26: ^8.5.26
  uuid: ^11.1.1
  postcss-selector-parser@<7: ^7.1.6

# offline-store 에 받아 둘 네이티브 패키지(sharp, @parcel/watcher 등)의 플랫폼 범위.
# 이 범위 밖의 OS/CPU 에서는 오프라인 설치가 실패한다. 범위를 바꾸면 offline:fetch 를 다시 실행한다.
supportedArchitectures:
  os: [linux, darwin, win32]
  cpu: [x64, arm64]
  libc: [glibc, musl]
